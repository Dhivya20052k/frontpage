<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Exam Results</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #c2e9fb, #a1c4fd);
      padding: 30px;
    }

    .container {
      background: white;
      padding: 25px;
      border-radius: 10px;
      max-width: 800px;
      margin: 0 auto;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: left;
    }

    th {
      background-color: #007BFF;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    .back-btn {
      display: block;
      margin-top: 20px;
      text-align: center;
    }

    .back-btn a {
      text-decoration: none;
      background-color: #007BFF;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
    }

    .back-btn a:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Exam Results</h2>
    <table id="resultsTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Course</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody>
        <!-- Rows will be injected here -->
      </tbody>
    </table>

    <div class="back-btn">
      <a href="index.html">Back to Home</a>
    </div>
  </div>

  <script>
    fetch("http://localhost:8080/api/results")
      .then(response => response.json())
      .then(data => {
        const tableBody = document.querySelector("#resultsTable tbody");
        data.forEach(result => {
          const row = `
            <tr>
              <td>${result.name}</td>
              <td>${result.email}</td>
              <td>${result.course}</td>
              <td>${result.score}</td>
            </tr>
          `;
          tableBody.insertAdjacentHTML("beforeend", row);
        });
      })
      .catch(error => {
        console.error("Failed to fetch results:", error);
        const tableBody = document.querySelector("#resultsTable tbody");
        tableBody.innerHTML = `<tr><td colspan="4">Error loading results.</td></tr>`;
      });
  </script>

</body>
</html>
